# Cambium CI on GitHub-hosted runners. Nothing here publishes or deploys: the
# image is built and smoke-tested only.
# Supply chain: actions are pinned by commit SHA, images by digest, tools by
# version (and checksum where downloaded). Update them deliberately, via PR.
# Fork PRs run with a read-only token and never on self-hosted runners.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal -c rustfmt,clippy && rustup default $RUST_TOOLCHAIN
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env: { POSTGRES_USER: cambium, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: cambium }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cambium" --health-interval 2s --health-retries 30
      rustfs:
        image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
        env: { RUSTFS_ACCESS_KEY: cambium-ci, RUSTFS_SECRET_KEY: ci-only-secret }
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal && rustup default $RUST_TOOLCHAIN
      - run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev pkg-config sqlite3 openssl
      - name: unit + integration + property tests
        run: cargo test --workspace --locked
      - name: Postgres + RustFS (S3) integration tests
        env:
          CAMBIUM_TEST_PG: "postgres://cambium:ci-only@127.0.0.1:5432/cambium"
          CAMBIUM_TEST_S3_ENDPOINT: "http://127.0.0.1:9000"
          CAMBIUM_TEST_S3_ACCESS_KEY: cambium-ci
          CAMBIUM_TEST_S3_SECRET_KEY: ci-only-secret
        run: |
          for i in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          cargo test --workspace --locked -- --ignored
      - name: simulation soak (new seed each run; replay with CAMBIUM_SIM_SEED)
        run: |
          echo "simulation seed: ${{ github.run_id }}"
          CAMBIUM_SIM_SEED=${{ github.run_id }} CAMBIUM_SIM_STEPS=1500 cargo test --locked -p cambium-core --test sim simulation_from_env -- --nocapture
      - name: fuzz properties on random input (new seed each run; replay with CAMBIUM_FUZZ_SEED)
        run: |
          echo "fuzz seed: ${{ github.run_id }}"
          CAMBIUM_FUZZ_SEED=${{ github.run_id }} CAMBIUM_FUZZ_ITERS=50000 cargo test --release --locked -p cambium-core --test fuzz_smoke
      - name: build
        run: cargo build --workspace --locked && cargo build --workspace --locked --release
      - name: end-to-end
        run: bash tests/e2e.sh
      - name: production checks
        run: bash tests/prod.sh
  fuzz:
    # coverage-guided fuzzing of the parsers that read outside input (fuzz/), one
    # minute per target; a crash fails the job and its input is kept as an artifact
    runs-on: ubuntu-24.04
    env:
      FUZZ_TOOLCHAIN: nightly-2026-10-28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install $FUZZ_TOOLCHAIN --profile minimal && cargo +$FUZZ_TOOLCHAIN install cargo-fuzz --version 0.13.2 --locked
      - name: fuzz each target for 60 s
        run: |
          cd fuzz
          for t in range path merge semantic owners git_commit; do
            echo "== $t"
            cargo +$FUZZ_TOOLCHAIN fuzz run $t -- -max_total_time=60 -rss_limit_mb=2048 || exit 1
          done
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: fuzz-artifacts, path: fuzz/artifacts }
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2
      - name: cargo audit (RustSec advisories)
        run: cargo audit --deny warnings
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny --locked check
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install --locked cargo-cyclonedx@0.5.9
      - run: cargo cyclonedx -f json --spec-version 1.5 && mkdir -p sbom && find crates -name '*.cdx.json' -exec mv {} sbom/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: sbom, path: sbom/, retention-days: 90 }
  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.17.3 }
      - name: install kubeconform v0.8.0 (checksum verified)
        run: |
          curl -sSLo /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kc.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
      - name: lint, render, kubeconform, policy checks
        run: bash tests/k8s-check.sh
  k8s-install:
    # the Helm chart installed for real on a throwaway kind cluster (tests/k8s-install.sh):
    # migrations, cache tiers, NetworkPolicy, a pod lost and a rolling upgrade under traffic
    needs: [helm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.17.3 }
      - name: install kind v0.33.0 (checksum verified)
        run: |
          curl -sSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - name: install on kind and exercise
        run: bash tests/k8s-install.sh
  image:
    needs: [lint, test, audit, sbom, helm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: sbom, path: sbom/ }
      - name: build runtime + tools images (no push)
        run: |
          docker build --target runtime -t cambium:${{ github.sha }} .
          docker build --target tools -t cambium-tools:${{ github.sha }} .
      - name: container smoke test (host client = the binaries shipped in the image)
        run: |
          id=$(docker create cambium:${{ github.sha }})
          mkdir -p /tmp/cambium-bin
          docker cp $id:/usr/local/bin/cmb /tmp/cambium-bin/cmb
          docker cp $id:/usr/local/bin/cmbd /tmp/cambium-bin/cmbd
          docker rm $id
          BIN=/tmp/cambium-bin IMG=cambium:${{ github.sha }} TOOLS_IMG=cambium-tools:${{ github.sha }} bash tests/docker-smoke.sh
      # Pushing to a registry and signing belong in a separate release workflow
      # (see docs/rollout-checklist.md).
