# cargo-deny policy for Cambium. Run: cargo deny --locked check
[graph]
all-features = false

[advisories]
# every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails the build
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# permissive licenses only; keep the dependency tree permissive (MIT-compatible)
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0", "0BSD", "BSL-1.0",
]
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "openssl", reason = "TLS is rustls/ring only" },
  { crate = "openssl-sys", reason = "TLS is rustls/ring only" },
  { crate = "native-tls", reason = "TLS is rustls/ring only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
