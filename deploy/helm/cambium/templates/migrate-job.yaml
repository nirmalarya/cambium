{{- if .Values.migrationJob.enabled }}
# Runs versioned schema migrations once, before new pods roll out. The
# Deployment runs with CAMBIUM_AUTO_MIGRATE=0, so pods refuse to start against a
# schema that has not been migrated yet.
# Hooks run before the chart's own objects exist, so this Job depends only on the
# pre-existing Secret: settings come straight from values (the new ones on an
# upgrade), and no chart ServiceAccount is referenced.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cambium.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "cambium.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        # not the app's selector labels: the Service and PDB must not pick this pod
        app.kubernetes.io/name: {{ include "cambium.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- include "cambium.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "cambium.image" . }}
          args: ["migrate"]
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          env:
            - { name: CAMBIUM_DATA, value: /data }
            {{- range $k, $v := .Values.config }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext: {{- include "cambium.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 256Mi }
{{- end }}
