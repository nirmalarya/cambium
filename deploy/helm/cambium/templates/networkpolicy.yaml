{{- if .Values.networkPolicy.enabled }}
# Internal-only: default-deny for the pods, then allow the ingress controller and
# monitoring in, and only DNS + Postgres/object store/IdP out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cambium.fullname" . }}
  labels: {{- include "cambium.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cambium.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - { protocol: TCP, port: 7878 }
    {{- if or .Values.edge.enabled .Values.daemon.enabled }}
    # the cache tiers in front of cmbd (the daemon only when there is no edge)
    - from:
        {{- if .Values.edge.enabled }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cambium-edge, app.kubernetes.io/instance: {{ .Release.Name }} }
        {{- else }}
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cambium-daemon, app.kubernetes.io/instance: {{ .Release.Name }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 7878 }
    {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to: {{- toYaml .Values.networkPolicy.egressTo | nindent 8 }}
      ports:
      {{- range .Values.networkPolicy.egressPorts }}
        - { protocol: TCP, port: {{ . }} }
      {{- end }}
{{- end }}
