apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cambium.fullname" . }}
  labels: {{- include "cambium.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "cambium.selector" . | nindent 6 }}
