{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cambium.fullname" . }}
  labels: {{- include "cambium.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "cambium.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.podTLS.enabled }}
      scheme: https
      tlsConfig: {{- toYaml .Values.serviceMonitor.tlsConfig | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceMonitor.bearerTokenFromSecret }}
      # CAMBIUM_METRICS_TOKEN from the same Secret the pods use
      authorization:
        type: Bearer
        credentials: { name: {{ .Values.existingSecret }}, key: CAMBIUM_METRICS_TOKEN }
      {{- end }}
{{- end }}
