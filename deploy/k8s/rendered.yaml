---
# Source: cambium/templates/networkpolicy.yaml
# Internal-only: default-deny for the pods, then allow the ingress controller and
# monitoring in, and only DNS + Postgres/object store/IdP out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cambium
  labels:
    app.kubernetes.io/name: cambium
    app.kubernetes.io/instance: cambium
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: cambium-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cambium
      app.kubernetes.io/instance: cambium
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-internal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 7878 }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 443 }
---
