# Source: cambium/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cambium
  labels:
    app.kubernetes.io/name: cambium
    app.kubernetes.io/instance: cambium
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: cambium-0.1.0
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: cambium
      app.kubernetes.io/instance: cambium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cambium
        app.kubernetes.io/instance: cambium
      annotations:
        checksum/config: 016af51fd9103d038be34e0557c63a08b90c135e9672518286329cd73cd5b077
    spec:
      serviceAccountName: cambium
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cambium
              app.kubernetes.io/instance: cambium
      containers:
        - name: cmbd
          image: registry.example.internal/cambium/cmbd:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: cambium }
            - secretRef: { name: cambium-secrets }
          ports:
            - { name: http, containerPort: 7878, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: { drop: ["ALL"] }
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # node-local scratch only: metadata lives in Postgres, content in the object store
        - name: data
          emptyDir: { sizeLimit: 1Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
# Source: cambium/templates/migrate-job.yaml
# Runs versioned schema migrations once, before new pods roll out. The
# Deployment runs with CAMBIUM_AUTO_MIGRATE=0, so pods refuse to start against a
# schema that has not been migrated yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: cambium-migrate-1
  labels:
    app.kubernetes.io/name: cambium
    app.kubernetes.io/instance: cambium
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: cambium-0.1.0
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cambium
        app.kubernetes.io/instance: cambium
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: cambium
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: registry.example.internal/cambium/cmbd:0.1.0
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: cambium }
            - secretRef: { name: cambium-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 256Mi }
