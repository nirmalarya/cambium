# Test-only dependencies for tests/k8s-install.sh: Postgres and RustFS inside the
# cluster, with throwaway credentials and no persistence. In production use a
# managed Postgres and object store (see docs/deploy.md); never these.
apiVersion: v1
kind: Namespace
metadata: { name: cambium }
---
apiVersion: v1
kind: Secret
metadata: { name: deps-credentials, namespace: cambium }
stringData:
  POSTGRES_PASSWORD: kind-test-only
  RUSTFS_ACCESS_KEY: kind-test-only
  RUSTFS_SECRET_KEY: kind-test-only-secret
---
# what the chart reads (existingSecret)
apiVersion: v1
kind: Secret
metadata: { name: cambium-secrets, namespace: cambium }
stringData:
  CAMBIUM_DB: postgres://cambium:kind-test-only@postgres.cambium.svc:5432/cambium
  CAMBIUM_S3_ACCESS_KEY: kind-test-only
  CAMBIUM_S3_SECRET_KEY: kind-test-only-secret
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: cambium }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
          env:
            - { name: POSTGRES_USER, value: cambium }
            - { name: POSTGRES_DB, value: cambium }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: deps-credentials, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "cambium"] }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: cambium }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rustfs, namespace: cambium }
spec:
  selector: { matchLabels: { app: rustfs } }
  template:
    metadata: { labels: { app: rustfs } }
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: deps-credentials, key: RUSTFS_ACCESS_KEY } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: deps-credentials, key: RUSTFS_SECRET_KEY } }
          ports: [{ containerPort: 9000 }]
          readinessProbe: { tcpSocket: { port: 9000 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata: { name: rustfs, namespace: cambium }
spec: { selector: { app: rustfs }, ports: [{ port: 9000 }] }
---
# where the test client runs; the chart's NetworkPolicy admits this namespace
apiVersion: v1
kind: Namespace
metadata: { name: cambium-client }
